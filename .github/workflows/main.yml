name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get install -y shellcheck shfmt pandoc
      - name: Run quality checks
        run: make check
      - name: Verify manpage generation
        run: make doc
